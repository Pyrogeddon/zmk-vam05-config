manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar  # <-- rgb remote add
      url-base: https://github.com/caksoylar  # <-- rgb remote add
    - name: Gasiro
      url-base: https://github.com/Gasiro
    - name: zzeneg # <-- required for Raw HID module
      url-base: https://github.com/zzeneg
    - name: srwi # <-- required for the KeyPeek Module
      url-base: https://github.com/srwi
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-rgbled-widget  # <-- rgb remote add
      remote: caksoylar  # <-- rgb remote add
      revision: v0.3  # <-- rgb remote add
    - name: zmk-batt-led-indicator
      remote: Gasiro
      revision: main
    - name: zmk-keypeek-layer-notifier # <-- KeyPeek module
      remote: srwi
      revision: master
  self:
    path: config
